name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # Node <- Dev Container CLI to test the feature
        with:
          node-version: "22"
      - name: Prepare mock authentication
        run: |
          mkdir -p "$HOME/.codex"
          touch "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"
      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli
      - name: Test Feature
        run: devcontainer features test --project-folder . --features codex --skip-scenarios
