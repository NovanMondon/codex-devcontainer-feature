name: Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/release.yaml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # Node <- Dev Container CLI to test the feature
        with:
          node-version: "22"
      - name: Test Feature
        run: |
          npm install --global @devcontainers/cli
          devcontainer features test --project-folder . --features codex --skip-scenarios
      - name: Publish Feature collection
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
